name: tests
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s benchmarks -v
      - run: python evidence/token-trial/audit.py evidence/token-trial/dev-fixed evidence/token-trial/heldout
      - run: python evidence/verify.py
      - run: python score.py examples/synthetic.csv --cases examples/cases.json --repeats 1
